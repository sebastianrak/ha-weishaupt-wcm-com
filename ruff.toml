target-version = "py313"
line-length = 110

[lint]
select = ["E", "F", "W", "B", "UP", "I"]
ignore = ["E501"]

[lint.isort]
known-first-party = ["custom_components"]
known-third-party = ["homeassistant", "pytest_homeassistant_custom_component"]
force-sort-within-sections = true
combine-as-imports = true
